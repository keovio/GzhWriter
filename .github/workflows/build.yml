name: Build Mac

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app (universal)
        run: |
          set -o pipefail
          UNIVERSAL=1 bash build.sh 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E "error:|warning: .*will be an error" build.log | head -60; echo; tail -40 build.log; echo '```'; } > report.md
          gh issue create --title "构建失败 #${{ github.run_number }}" --body-file report.md

      - name: Screenshots
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots
          for p in workbench radar library accounts styles publish models; do
            GZH_DEMO=1 GZH_PANE=$p ./build/GzhWriter.app/Contents/MacOS/GzhWriter > /dev/null 2>&1 &
            PID=$!
            sleep 9
            screencapture -x shots/$p.png || true
            kill $PID || true
            sleep 2
            [ -f shots/$p.png ] && sips -Z 1600 -s format jpeg shots/$p.png --out shots/$p.jpg > /dev/null && rm shots/$p.png
          done
          cd shots
          git init -q
          git checkout -q -b shots
          git add .
          git -c user.name=ci -c user.email=ci@local commit -qm "shots ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" shots

      - name: Zip app
        run: cd build && ditto -c -k --keepParent GzhWriter.app GzhWriter.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: build/GzhWriter.zip

  win:
    # Windows / Linux 暂停更新（2026-10-27），最后一版在 build-151
    if: false
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        shell: bash
        run: npm install --no-audit --no-fund 2>&1 | tee ../install.log

      - name: Screenshots
        continue-on-error: true
        shell: bash
        env:
          GZH_DEMO: '1'
          GZH_SHOTS: workbench,library,editor,accounts,styles,models
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 120 npx electron . || true
          cd shots
          git init -q
          git checkout -q -b shots-win
          git add .
          git -c user.name=ci -c user.email=ci@local commit -qm "win shots ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" shots-win

      - name: Build exe
        shell: bash
        run: npm run dist 2>&1 | tee ../build.log

      - name: Report build errors
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; tail -40 ../install.log 2>/dev/null; echo; tail -80 ../build.log 2>/dev/null; echo '```'; } > report.md
          gh issue create --title "Windows 构建失败 #${{ github.run_number }}" --body-file report.md

      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: windows/dist/*.exe

  linux:
    if: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build AppImage + deb
        run: |
          set -o pipefail
          npm install --no-audit --no-fund
          npm run dist:linux 2>&1 | tee ../build.log
      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; tail -80 ../build.log 2>/dev/null; echo '```'; } > report.md
          gh issue create -R ${{ github.repository }} --title "Linux 构建失败 #${{ github.run_number }}" --body-file report.md
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            windows/dist/*.AppImage
            windows/dist/*.deb

  release:
    needs: [mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          ls -la out
          gh release create "$TAG" out/* -R ${{ github.repository }} --target ${{ github.sha }} \
            --title "GzhWriter $TAG" --latest \
            --notes "Mac：下载 GzhWriter.zip，解压后把 GzhWriter.app 拖进「应用程序」；首次打开若被拦截，在终端运行 xattr -cr /Applications/GzhWriter.app。
          Windows / Linux 暂停更新，最后一版见 build-151。"
          # 只留最新这一个，外加 Windows/Linux 最后一版 build-151
          gh release list -R ${{ github.repository }} --limit 50 --json tagName -q '.[].tagName' | grep -vx "$TAG" | grep -vx "build-151" | while read t; do
            gh release delete "$t" -R ${{ github.repository }} --cleanup-tag -y || true
          done
